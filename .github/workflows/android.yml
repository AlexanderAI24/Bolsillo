name: Compilar APK de Bolsillo

on:
  push:
    paths:
      - 'android-src/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        working-directory: android-src
        run: gradle assembleDebug --no-daemon

      - name: Publicar el APK
        uses: actions/upload-artifact@v4
        with:
          name: bolsillo-apk
          path: android-src/app/build/outputs/apk/debug/*.apk
          retention-days: 90
